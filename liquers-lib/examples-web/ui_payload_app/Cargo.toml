[package]
name = "ui_payload_app_web"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
liquers-core = { path = "../../../liquers-core" }
liquers-lib = { path = "../..", default-features = false, features = ["webui"] }
liquers-macro = { path = "../../../liquers-macro" }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
# needed because the register_lui_commands! / register_command! macros expand into this crate and
# reference these paths.
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
typetag = "0.2"
web-sys = { version = "0.3", features = ["Document", "Window", "Element", "console"] }
tokio = { version = "1.47.1", features = ["sync", "rt", "macros", "time"] }
