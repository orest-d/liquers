[package]
name = "liquers-web"
version = "0.1.0"
edition = "2021"
description = "Browser/JavaScript integration of Liquers, compiled to WebAssembly."

# cdylib for the wasm artifact; rlib so a downstream crate can reuse the generic bridge
# (the Tier-2 extension path — see specs/design/liquers-web/phase2-architecture.md, "Extensibility").
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
liquers-core = { path = "../liquers-core" }
# `webui` (not `egui`, not `polars`) — those are not wasm targets.
liquers-lib = { path = "../liquers-lib", default-features = false, features = ["webui"] }
# Linked because `register_core_commands!` expands into this crate and names `liquers_macro`.
liquers-macro = { path = "../liquers-macro" }
# Configuration and the store-router builder, without OpenDAL — which is native-oriented and
# large. `StoreFactory` (added for this crate) is what lets the browser store types plug in.
# See specs/design/liquers-web-store/.
# localStorage holds UTF-16 strings, so bytes that are not valid UTF-8 are base64-encoded.
base64 = "0.22"
# `AsyncStore` is declared with `#[async_trait(?Send)]` on wasm, so its implementors need the
# attribute too — without it the impl is checked as an async-fn-in-trait against a desugared
# trait, and every method reports a lifetime mismatch instead of the missing dependency.
async-trait = "0.1"

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Named by the `register_core_commands!` expansion.
futures = "0.3"

[dependencies.web-sys]
version = "0.3"
# `Storage` for the localStorage store; `Response`/`Headers` for the fetch store.
# Deliberately *not* `WorkerGlobalScope`: the `fetch` function is taken from `js_sys::global()`,
# which works in a window, a worker and under Node alike — see
# specs/design/liquers-web-store/phase2-architecture.md.
# Deliberately not `Request`/`RequestInit` either: the request options are a plain object built
# with `js_sys`, which keeps the code off an API that has changed shape across web-sys releases.
features = ["console", "Window", "Storage", "Response", "Headers"]

[dev-dependencies]
# The shared AsyncStore conformance suite. A dev-dependency, so the feature never reaches the
# published wasm bundle: `cargo build` does not build dev-dependencies, and cargo only unifies it
# into the `cargo test` graph.
liquers-core = { path = "../liquers-core", features = ["store-conformance"] }
wasm-bindgen-test = "0.3"
# `select`/`pin_mut` for the RUNTIME04 timeouts — a deadlock must fail with a name, not hang.
futures = "0.3"

[features]
default = []
# Forwarded so that `#[cfg(feature = "...")]` in this crate agrees with which ExtValue variants
# actually exist. Without forwarding, these cfgs are evaluated against *this* crate's feature set,
# are therefore always false, and a match on ExtValue would silently omit arms that a
# feature-unified build does have.
polars = ["liquers-lib/polars"]
egui = ["liquers-lib/egui"]
# Exposes a live count of retained JS handles so RUNTIME05 can assert handle release
# deterministically, rather than depending on GC timing. Test-only.
debug-handles = []
# Compiles the test files that require a real browser. Off by default so that the routine loop —
# `cargo test -p liquers-web --target wasm32-unknown-unknown`, which runs under Node — is not
# dragged into needing a WebDriver by a single file carrying `run_in_browser`. Test-only.
# See liquers-web/README.md and specs/design/liquers-web-store/.
browser-tests = []
