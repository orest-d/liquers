[package]
name = "liquers-core"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
crate-type = ["cdylib", "lib"]

[features]
default=[]
# Compatibility feature kept for existing Cargo feature selections. The async store API is part
# of core in every build; this feature no longer controls dependencies or public symbols.
async_store=[]
tokio_exec=[]
# Command-line tools. Deliberately NOT in `default`: this keeps clap out of every
# library consumer (liquers-py, wasm builds) while still shipping the validator.
cli=["dep:clap"]

# The full WHATWG HTML5 named-entity table (~2125 names, ~28 KB of static data).
# Deliberately NOT in `default`: cargo features unify across the dependency graph, and
# `liquers-lib` and `liquers-store` both depend on this crate with its defaults on, so anything
# in `default` is unavoidable for the wasm bundle whatever `liquers-web` declares. Keeping it
# out means unification can only ever add it, and nothing in the wasm graph asks for it.
# Without it, a build decodes the curated set of ~203 names, which is what the encoder emits —
# so everything any build encodes, every build decodes.
# See specs/design/parameter-entity-escaping/.
entities-html5=[]

# The AsyncStore behavioural conformance suite (liquers_core::store_conformance).
# Deliberately NOT in `default`, for the reason given above for entities-html5: cargo features
# unify additively across the dependency graph, and liquers-lib and liquers-store both depend on
# this crate with defaults on, so anything in `default` is unavoidable for the wasm bundle whatever
# liquers-web declares. Keeping it out means unification can only ever add it, and nothing in a
# production graph asks for it. Consumers enable it in [dev-dependencies].
# See specs/design/store-conformance-suite/.
store-conformance=[]

# TOML parsing for configuration documents (StoreRouterConfig::from_toml).
# Deliberately NOT in `default`, matching how liquers-store gated it before the configuration
# types moved here: a consumer that never reads TOML should not link a TOML parser.
# liquers-store forwards its own `toml` feature to this one.
toml=["dep:toml"]

# The `liquers-validate` query validation utility. See specs/design/query-validation/.
# An explicit [[bin]] block is required: auto-discovered binaries in src/bin/
# cannot carry `required-features`, so without this the crate would try to build
# the binary — and fail on the missing clap — whenever `cli` is off.
[[bin]]
name = "liquers-validate"
path = "src/bin/liquers_validate.rs"
required-features = ["cli"]

# Regenerates src/entities_data.rs from data/entities.json. Same `required-features` reason as
# above: an auto-discovered binary in src/bin/ cannot carry one, so the block is explicit.
[[bin]]
name = "generate-entities"
path = "src/bin/generate_entities.rs"
required-features = ["cli"]

[dependencies]
itertools = "0.14.0"
clap = { version = "4", features = ["derive"], optional = true }
nom = "8.0.0"
nom_locate = "5.0.0"
regex = "1.13.1"
serde = "1.0.229"
serde_derive = "1.0.229"
serde_json = "1.0.151"
serde_yaml = "0.9.34"
toml = { version = "0.8", optional = true }
thiserror = "2.0.20"
chrono = "0.4.45"
blake3 = "1.8.7"
scc = "3.8.8"
ansic = "0.1.7"
futures = "0.3.34"
async-trait = "0.1.92"

# tokio: native keeps `fs` (used by AsyncFileStore); wasm drops `fs`/`net`
# (not supported on wasm32-unknown-unknown). Both keep sync/rt/macros/time.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.53.1", features = ["sync", "rt", "macros", "time", "fs"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.53.1", features = ["sync"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["console"] }

[dev-dependencies]
tokio = {version="1.53.1", features = ["full"]}
futures = {version="0.3.34", features=["executor"]}
liquers-macro={path="../liquers-macro"}
