[package]
name = "liquers-core"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
crate-type = ["cdylib", "lib"]

[features]
default=["async_store"]
async_store=["futures", "async-trait"]
tokio_exec=["futures", "async-trait", "async_store"]
# Command-line tools. Deliberately NOT in `default`: this keeps clap out of every
# library consumer (liquers-py, wasm builds) while still shipping the validator.
cli=["dep:clap"]

# The `liquers-validate` query validation utility. See specs/design/query-validation/.
# An explicit [[bin]] block is required: auto-discovered binaries in src/bin/
# cannot carry `required-features`, so without this the crate would try to build
# the binary — and fail on the missing clap — whenever `cli` is off.
[[bin]]
name = "liquers-validate"
path = "src/bin/liquers_validate.rs"
required-features = ["cli"]

[dependencies]
itertools = "0.14.0"
clap = { version = "4", features = ["derive"], optional = true }
nom = "8.0.0"
nom_locate = "5.0.0"
regex = "1.9.3"
serde = "1.0.181"
serde_derive = "1.0.181"
serde_json = "1.0.104"
serde_yaml = "0.9.33"
thiserror = "2.0.9"
chrono = "0.4.31"
blake3 = "1.8.1"
scc = "3.4.8"
ansic = "0.1.7"

# tokio: native keeps `fs` (used by AsyncFileStore); wasm drops `fs`/`net`
# (not supported on wasm32-unknown-unknown). Both keep sync/rt/macros/time.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.47.1", features = ["sync", "rt", "macros", "time", "fs"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.47.1", features = ["sync"] }

[dev-dependencies]
tokio = {version="1.47.1", features = ["full"]}
futures = {version="0.3.31", features=["executor"]}
liquers-macro={path="../liquers-macro"}

[dependencies.futures]
version = "0.3.31"
optional=true

[dependencies.async-trait]
version = "0.1.80"
optional=true
