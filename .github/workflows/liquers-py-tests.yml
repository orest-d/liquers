name: liquers-py-tests

# Runs the liquers-py test loop (scripts/test-liquers-py.sh: maturin develop, pytest, then the
# crate's Rust unit tests) on the newest stable CPython for pull requests, and also on the oldest
# supported one and the free-threaded build for main pushes and manual runs, under a virtual display so the window tests run too. Designs:
# specs/design/language-binding-tests-in-ci/, specs/design/liquers-py-ui-window/.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      # every workspace crate is a liquers-* directory; the negations drop crates liquers-py does
      # not build from
      - 'liquers-*/**'
      - '!liquers-web/**'
      - '!liquers-axum/**'
      - '!liquers-mcp/**'
      - '!liquers-agent/**'
      - '!liquers-docs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'scripts/test-liquers-py.sh'
      - '.github/workflows/liquers-py-tests.yml'
  push:
    branches: [main]
    paths:
      # every workspace crate is a liquers-* directory; the negations drop crates liquers-py does
      # not build from
      - 'liquers-*/**'
      - '!liquers-web/**'
      - '!liquers-axum/**'
      - '!liquers-mcp/**'
      - '!liquers-agent/**'
      - '!liquers-docs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'scripts/test-liquers-py.sh'
      - '.github/workflows/liquers-py-tests.yml'
  workflow_dispatch:

# A newer push to the same pull request cancels the run still in progress; runs on main are never
# cancelled. See specs/guides/GITHUB_ACTIONS_GUIDE.md §1a.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    # draft pull requests are skipped; marking one ready for review runs it
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        # Pull requests run the newest stable CPython only (it also carries the typing leg); main
        # pushes and manual runs add the oldest supported one and the free-threaded build.
        python: ${{ fromJSON(github.event_name == 'pull_request' && '["3.14"]' || '["3.10", "3.14", "3.14t"]') }}
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h /
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: liquers-py
          save-if: ${{ github.ref == 'refs/heads/main' && matrix.python == '3.14' }}
      - uses: actions/setup-python@v5
        id: py
        with:
          python-version: ${{ matrix.python }}
      # pyright's npm package, which the `pyright` wrapper downloads on its first run (typing leg).
      - uses: actions/cache@v4
        if: matrix.python == '3.14'
        with:
          path: ~/.cache/pyright-python
          key: pyright-python-1.1.414
      # A restored venv would point at a toolcache interpreter that no longer exists.
      - run: rm -rf target/liquers-py-venv-*
      # The `gui` tests (tests/test_UIUSE_window.py) open egui windows on a virtual display: winit
      # loads libxkbcommon-x11 at run time, and wgpu needs a software Vulkan (lavapipe) without a GPU.
      - name: Install a virtual display
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libxkbcommon-x11-0 mesa-vulkan-drivers
      - name: Run the liquers-py test loop
        run: xvfb-run -a bash scripts/test-liquers-py.sh
        env:
          PYTHON: ${{ steps.py.outputs.python-path }}
      - run: df -h /
