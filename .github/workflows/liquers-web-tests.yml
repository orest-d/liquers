name: liquers-web-tests

# Runs liquers-web's conformance suites under Node (wasm-bindgen-test-runner), with and without the
# `records` feature, and the JavaScript examples of specs/guides/JAVASCRIPT_GUIDE.md and of the
# user guide docs/guides/web/ against a `records` build. The browser and Playwright loops are not
# run here.
# Design: specs/design/language-binding-tests-in-ci/.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      # every workspace crate is a liquers-* directory; the negations drop crates liquers-web does
      # not build from
      - 'liquers-*/**'
      - '!liquers-py/**'
      - '!liquers-axum/**'
      - '!liquers-mcp/**'
      - '!liquers-agent/**'
      - '!liquers-docs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      # the guides whose JavaScript examples the last step runs
      - 'docs/guides/web/**'
      - 'specs/guides/JAVASCRIPT_GUIDE.md'
      - '.github/workflows/liquers-web-tests.yml'
  push:
    branches: [main]
    paths:
      # every workspace crate is a liquers-* directory; the negations drop crates liquers-web does
      # not build from
      - 'liquers-*/**'
      - '!liquers-py/**'
      - '!liquers-axum/**'
      - '!liquers-mcp/**'
      - '!liquers-agent/**'
      - '!liquers-docs/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      # the guides whose JavaScript examples the last step runs
      - 'docs/guides/web/**'
      - 'specs/guides/JAVASCRIPT_GUIDE.md'
      - '.github/workflows/liquers-web-tests.yml'
  workflow_dispatch:

# A newer push to the same pull request cancels the run still in progress; runs on main are never
# cancelled. See specs/guides/GITHUB_ACTIONS_GUIDE.md §1a.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    # draft pull requests are skipped; marking one ready for review runs it
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h /
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Cargo.lock is not committed (.gitignore), so resolve it here; the runner must match the
      # wasm-bindgen version the build resolves to.
      - name: Resolve Cargo.lock
        run: cargo generate-lockfile
      - name: Install wasm-bindgen-test-runner matching Cargo.lock
        run: |
          ver=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          test -n "$ver"
          echo "wasm-bindgen $ver"
          cargo install wasm-bindgen-cli --version "$ver" --locked
      - run: cargo test -p liquers-web --target wasm32-unknown-unknown --features debug-handles
      - run: cargo test -p liquers-web --target wasm32-unknown-unknown --features debug-handles,records
      - name: Run the guides' JavaScript examples
        run: ./liquers-web/scripts/test-guide-examples.sh --features records
      - run: df -h /
