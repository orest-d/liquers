name: build-matrix

# Runs the feature/target build matrix that scripts/check-build-matrix.sh defines. Nothing else
# runs `cargo check`/`cargo test` in CI, so a configuration outside the default features (or the
# wasm32 target) could silently break — see specs/issues/BUILD-MATRIX-NOT-RUN-IN-CI.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      # every workspace crate is a liquers-* directory; a member named otherwise needs its own entry
      - 'liquers-*/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'scripts/check-build-matrix.sh'
      - '.github/workflows/build-matrix.yml'
  push:
    branches: [main]
    paths:
      # every workspace crate is a liquers-* directory; a member named otherwise needs its own entry
      - 'liquers-*/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.cargo/**'
      - 'scripts/check-build-matrix.sh'
      - '.github/workflows/build-matrix.yml'
  workflow_dispatch:

# A newer push to the same pull request cancels the run still in progress; runs on main are never
# cancelled. See specs/guides/GITHUB_ACTIONS_GUIDE.md §1a.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # draft pull requests are skipped; marking one ready for review runs it
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Run the feature/target build matrix
        run: bash scripts/check-build-matrix.sh

  # Intra-doc links must resolve (specs/guides/API_DOCUMENTATION_GUIDE.md §5, §10). Only the crates
  # that are clean and need no optional native library are listed; liquers-lib and the crates built
  # on it join once liquers-lib's links are clean.
  rustdoc:
    # draft pull requests are skipped; marking one ready for review runs it
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: rustdoc with broken intra-doc links denied
        run: cargo doc --no-deps -p liquers-core -p liquers-records -p liquers-template -p liquers-store -p liquers-mcp -p liquers-markdown
