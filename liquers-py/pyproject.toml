[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "liquers-py"
# PyO3 0.30 supports CPython 3.9 to 3.15 and PyPy 3.11 or newer; see README.md
requires-python = ">=3.9,<3.16"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Programming Language :: Python :: Free Threading :: 2 - Beta",
]
dynamic = ["version"]

[tool.maturin]
# Mixed Rust/Python project: the pure-Python package `liquers` lives under `python/`, and the
# Rust extension is built into it as `liquers._native`.
python-source = "python"
module-name = "liquers._native"
features = ["pyo3/extension-module"]
