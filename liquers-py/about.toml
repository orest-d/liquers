# cargo-about configuration for the third-party notices shipped in the liquers-py wheel
# (`python/liquers/THIRD-PARTY-NOTICES.html`, generated by the release workflow's `notices` job,
# never committed). Run from the repository root:
#
#   cargo about generate -m liquers-py/Cargo.toml -c liquers-py/about.toml \
#     -o liquers-py/python/liquers/THIRD-PARTY-NOTICES.html liquers-py/about.hbs
#
# `accepted` is the set of licenses a dependency may be used under. A dependency whose license is
# not listed fails generation, which is the point: adding a license here is a decision, made in
# review. The Liquers crates themselves are AGPL-3.0-or-later.
accepted = [
    "AGPL-3.0-or-later",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "BSL-1.0",
    "CC0-1.0",
    "0BSD",
    "Unlicense",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]
# Every platform a wheel is built for, so one run covers each target's dependencies.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
]
# Only what the wheel links: no dev-dependencies or build-only tools.
ignore-dev-dependencies = true
ignore-build-dependencies = true
# The workspace's own crates are listed under the project's license, not as third parties.
private = { ignore = true }
