# mypy configuration of the liquers-py typing checks (tests/test_STUBS_declarations.py).
[mypy]
strict = True
warn_unused_ignores = True
python_version = 3.14

# Optional third-party packages that ship no type information (measured on pyarrow 26.0):
# `_records.py` imports them lazily, and they are `Any` to the checkers.
[mypy-pyarrow.*,pandas.*]
ignore_missing_imports = True
