[package]
name = "liquers-py"
version.workspace = true
edition = "2021"
rust-version.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "liquers_py"
# `rlib` alongside `cdylib` so `cargo test -p liquers-py` has a library to link a test harness
# against; the `cdylib` is what maturin packages and is unchanged.
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30.1" }
liquers-core={path="../liquers-core"}
# The value type, the command library and the default environment. `egui` is left out: a Python
# process has no egui event loop, and it is the heaviest optional dependency.
liquers-lib = { path = "../liquers-lib", default-features = false, features = ["image-support", "polars", "records", "records-ipc", "records-parquet", "templates"] }
# Linked because the liquers-lib command macros expand into this crate and name these crates.
liquers-macro = { path = "../liquers-macro" }
# The record traits the `lq.RecordView` / `lq.RecordSource` wrappers read through, and the IPC
# format the Arrow exits go through (`src/records/`). Already in the graph through liquers-lib.
liquers-records = { path = "../liquers-records", features = ["ipc"] }
# Already in the graph through liquers-lib; named here for its store factory chain (memory,
# filesystem, then the OpenDAL types), which a configured `lq.Environment(config=…)` builds with.
liquers-store = { path = "../liquers-store" }
futures = "0.3"
async-trait = "0.1"
# One multi-thread runtime per process runs every evaluation (`runtime.rs`).
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
# Awaitable results (`_async` methods) on the caller's asyncio loop, driven by the runtime above
# (`runtime.rs` binds it, so the bridge never builds a second one).
pyo3-async-runtimes = { version = "0.30", features = ["tokio-runtime"] }
serde = "1.0.229"
serde_derive = "1.0.229"
serde_json = "1.0.151"
serde_yaml = "0.9.34"
once_cell = "1.21.4"
chrono = "0.4.45"

[features]
default=["async_store", "extension-module"]
# Kept so existing `--features async_store` invocations still resolve; it gates nothing since
# the store is always async (`CORE-SYNC-STORE-TRAIT-OBSOLETE`).
async_store=[]

# `pyo3/extension-module` omits the Python symbols so the built `cdylib` resolves them from the
# interpreter that loads it. That is right for the wheel and fatal for a test binary, which has no
# interpreter to resolve them against and fails to link with `undefined symbol: _Py_Dealloc`.
# Keeping it behind a *default* feature leaves every ordinary build and the maturin wheel exactly
# as they were, while `cargo test -p liquers-py --no-default-features` links against libpython and
# can run. This is the recipe the PyO3 guide gives for exactly this problem.
extension-module=["pyo3/extension-module"]

# Test-only: exposes `Environment.live_handle_count()`, the number of Python callables the command
# registrations hold, so `RUNTIME05` can assert their release deterministically rather than through
# garbage-collector timing. `scripts/test-liquers-py.sh` builds with it; a wheel never does.
debug-handles=[]

# The stable-ABI wheel (`cp314-abi3`), one wheel for CPython 3.14 and every later GIL-enabled
# release. Only the release workflow's abi3 jobs pass it; the free-threaded wheels (`cp314t`,
# `cp315t`) are version-specific, since the free-threaded stable ABI (abi3t) does not import yet
# (`PY-ABI3T-WHEEL-NOT-USED`). 3.14 is the floor because the buffer protocol the record columns
# lend needs the limited API of 3.11 or newer, and wheels start at 3.14 (Orest, 2026-11-01).
abi3=["pyo3/abi3-py314"]
