[package]
name = "liquers-template"
version.workspace = true
edition = "2021"
rust-version.workspace = true
description = "Query-aware Mustache templates for Liquers"
license.workspace = true
exclude = ["tests/spec", "tests/spec.rs", "tests/node.rs"]

# Depends on liquers-core only, and adds no async runtime: rendering uses `futures` and core's
# `maybe_send`, so the crate builds for wasm32 as it does natively
# (specs/design/liquers-mustache/phase2-architecture.md).
[dependencies]
liquers-core = { path = "../liquers-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
futures = "0.3.34"
async-trait = "0.1.92"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
